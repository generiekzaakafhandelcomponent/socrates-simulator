spring.application.name=socrates-simulator
server.port=5030

# SpringDoc configuration
springdoc.swagger-ui.path=/swagger-ui.html

# The real Wigo4it LO API accepts request properties regardless of case (e.g. camelCase `loBehandeld`
# from Socrates plugin <= 2.0.x, so the simulator does too.
spring.jackson.mapper.accept-case-insensitive-properties=true
