name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GITHUB_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: socrates-simulator
  GITHUB_NAMESPACE: generiekzaakafhandelcomponent

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tagToDeploy: ${{ steps.prep.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate unique docker tag
        id: prep
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[\/+|<>,;-]//g')
          DATETIME=$(date "+%Y%m%d%H%M")
          BASE_VERSION=$(grep '^version\.semver=' version.properties | cut -d'=' -f2)
          SHA=${{ github.sha }}
          SEM_VERSION="${BASE_VERSION}-${DATETIME}.${SHORT_BRANCH_NAME}.${SHA:0:8}"
          echo "image_tag=$SEM_VERSION" >> $GITHUB_OUTPUT

      - name: Run tests
        run: ./gradlew clean test

      - name: Build artifacts
        run: ./gradlew build -x test

      - name: Archive build folder
        uses: actions/upload-artifact@v4
        with:
          name: socrates-simulator-build
          path: build/

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: socrates-simulator-build
          path: build/

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          context: .
          push: true
          tags: ${{ env.GITHUB_REGISTRY }}/${{ env.GITHUB_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:${{ needs.build.outputs.tagToDeploy }}
